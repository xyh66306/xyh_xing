<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Money')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-money" data-rule="required" class="form-control" step="0.01" name="row[money]" type="number" value="{$row.money|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Access_key')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-access_key" class="form-control" name="row[access_key]" type="text" value="{$row.access_key|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Access_secret')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-access_secret" class="form-control" name="row[access_secret]" type="text" value="{$row.access_secret|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('兑出')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-duichu" class="form-control" name="row[duichu]" type="text" value="{$row.duichu|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('兑入')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-duiru" class="form-control" name="row[duiru]" type="text" value="{$row.duiru|htmlentities}">
        </div>
    </div>    


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('兑出手续费')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-duichu_fanyong" class="form-control" name="row[duichu_fanyong]" type="text" value="{$row.duichu_fanyong|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('兑入手续费')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-duiru_rate" class="form-control" name="row[duiru_rate]" type="text" value="{$row.duiru_rate|htmlentities}">
        </div>
    </div>  
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('充值手续费')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cz_rate" class="form-control" name="row[cz_rate]" type="text" value="{$row.cz_rate|htmlentities}">
        </div>
    </div>        

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
